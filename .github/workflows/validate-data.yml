name: Validate Thesaurus Data

on:
  push:
    branches:
      - main
    paths:
      - 'web/thesauruses/**'
      - 'requirements.txt'
      - 'manage.py'
      - '.github/workflows/validate-data.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/thesauruses/**'
      - 'requirements.txt'
      - 'manage.py'
      - '.github/workflows/validate-data.yml'

jobs:
  validate:
    name: Validate Data Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.4
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create SQLite local database
        run: python manage.py migrate

      - name: Validate Meta Info File
        run: python manage.py validatemetainfofile

      - name: Validate Language Info Files
        run: python manage.py validatelanginfofiles
