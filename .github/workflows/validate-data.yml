name: Validate Thesaurus Data

on:
  push:
    branches:
      - main
    paths:
      - 'web/thesauruses/**'
      - 'requirements.txt'
      - 'manage.py'
      - '.github/workflows/validate-data.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/thesauruses/**'
      - 'requirements.txt'
      - 'manage.py'
      - '.github/workflows/validate-data.yml'

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Data Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.4
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create SQLite local database
        run: python manage.py migrate

      - name: Validate Meta Info File
        run: python manage.py validatemetainfofile

      - name: Validate Language Info Files
        run: python manage.py validatelanginfofiles
