name: Check Docker Build

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - 'requirements.txt'
      - 'Procfile'
      - '.github/workflows/check-docker-build.yml'

jobs:
  check:
    name: Check Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose Build
        run: docker compose build
